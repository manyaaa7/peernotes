{% extends 'notes/base.html' %}
{% block content %}
<div class="card" style="max-width:500px; margin:2rem auto;">
  <h2 style="margin-bottom:1rem;">Create PeerNotes Account</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width:100%;">Create Account</button>
  </form>
</div>
{% endblock %}
