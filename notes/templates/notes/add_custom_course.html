{% extends 'notes/base.html' %}
{% block content %}
<div class="card" style="max-width:500px; margin:1.5rem auto;">
  <h2>Add Open Elective / Custom Subject</h2>
  <p style="color:var(--muted);">Adding to {{ branch }} — Semester {{ semester }}</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn" style="width:100%;">Create Subject & Continue to Upload</button>
  </form>
</div>
{% endblock %}
